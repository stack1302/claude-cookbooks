name: "Docker Image CI + Run + Healthcheck + (Push on main, Echo-Enhanced)"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-image-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  ARTIFACT_DIR: .github/echo_artifacts
  DOCKER_BUILDKIT: "1"
  HEALTH_PORT: "8080"
  HEALTH_PATH: "/"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare echo helpers (global via BASH_ENV)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}" "${ARTIFACT_DIR}"

          # ==== echo helpers (column-0; no heredoc pitfalls) ====
          cat >/tmp/echo_helpers.sh <<'SH'
#!/usr/bin/env bash
set -Eeuo pipefail

# --- basic echo ---
TS(){ date "+%Y-%m-%d %H:%M:%S%z"; }
OK(){ echo "✅ $(TS) $*"; }
WARN(){ echo "⚠️  $(TS) $*" >&2; }
FAIL(){ echo "❌ $(TS) $*" >&2; }

# --- sections for nice logs ---
SECTION(){ echo; echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"; echo "🔷 $*"; echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"; }

# --- safe runner ---
SAFE(){
  if "$@"; then
    OK "$*"
  else
    local rc=$?
    FAIL "$* (exit $rc)"
    return $rc
  fi
}

# --- retry helper ---
RETRY(){
  local n="${1:-3}"; shift || true
  local delay=2
  local i
  for ((i=1;i<=n;i++)); do
    if "$@"; then
      OK "Retry OK($i/$n): $*"
      return 0
    fi
    WARN "Retry $i/$n failed: $*"
    sleep "$delay"
    delay=$((delay*2))
  done
  FAIL "All retries failed: $*"
  return 1
}
SH
          chmod +x /tmp/echo_helpers.sh

          # 모든 bash 스텝에서 자동 로드
          cat >/tmp/ci_bash_env <<'ENV'
source /tmp/echo_helpers.sh
set -Eeuo pipefail
shopt -s expand_aliases
ENV
          echo "BASH_ENV=/tmp/ci_bash_env" >> "$GITHUB_ENV"

          source /tmp/echo_helpers.sh
          SECTION "Helpers"
          OK "Echo helpers installed and auto-loaded."

      - name: Docker sanity
        shell: bash
        run: |
          SECTION "Docker Sanity"
          SAFE docker --version | tee "${LOG_DIR}/docker.version.txt"
          SAFE docker info | tee "${LOG_DIR}/docker.info.txt"

      - name: Setup Buildx (cache)
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          SECTION "Compute Image Tags"
          ts="$(date +%Y%m%d%H%M%S)"
          sha_short="${GITHUB_SHA::7}"
          echo "local_tag=my-image-name:${ts}" | tee "${LOG_DIR}/image.local.txt"
          repo="ghcr.io/${GITHUB_REPOSITORY}"
          {
            echo "repo=${repo}"
            echo "sha_tag=${repo}:${sha_short}"
            echo "time_tag=${repo}:${ts}"
            echo "latest_tag=${repo}:latest"
          } | tee "${LOG_DIR}/image.ghcr.txt"
          {
            echo "local_tag=my-image-name:${ts}"
            echo "repo=${repo}"
            echo "sha_tag=${repo}:${sha_short}"
            echo "time_tag=${repo}:${ts}"
            echo "latest_tag=${repo}:latest"
          } >> "$GITHUB_OUTPUT"
          OK "Tags prepared."

      - name: Generate minimal Dockerfile if missing (printf; no heredoc)
        shell: bash
        run: |
          SECTION "Dockerfile Check/Generate"
          if [[ ! -f Dockerfile ]]; then
            WARN "Dockerfile not found. Generating minimal via printf."
            : > Dockerfile
            printf '%s\n' "FROM ubuntu:24.04" >> Dockerfile
            printf '%s\n' "ENV DEBIAN_FRONTEND=noninteractive" >> Dockerfile
            printf '%s\n' "RUN apt-get update -y && apt-get install -y --no-install-recommends \\" >> Dockerfile
            printf '%s\n' "      ca-certificates curl tini python3 && \\" >> Dockerfile
            printf '%s\n' "    rm -rf /var/lib/apt/lists/*" >> Dockerfile
            printf '%s\n' "WORKDIR /app" >> Dockerfile
            printf '%s\n' "COPY . /app" >> Dockerfile
            printf '%s\n' "EXPOSE 8080" >> Dockerfile
            printf '%s\n' 'ENTRYPOINT ["/usr/bin/tini","--"]' >> Dockerfile
            printf '%s\n' 'CMD ["bash","-lc","python3 -m http.server 8080"]' >> Dockerfile
            OK "Generated minimal Dockerfile."
          else
            OK "Using existing Dockerfile."
          fi

      - name: Build (PR: load / Push: push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.local_tag }}
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.time_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to GHCR (only on push)
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push :latest (main push)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          SECTION "Push :latest"
          RETRY 3 docker pull "${{ steps.meta.outputs.time_tag }}" || true
          SAFE docker tag  "${{ steps.meta.outputs.time_tag }}" "${{ steps.meta.outputs.latest_tag }}"
          SAFE docker push "${{ steps.meta.outputs.latest_tag }}" | tee "${LOG_DIR}/docker.push.latest.txt"

      - name: Show images
        shell: bash
        run: |
          SECTION "Images"
          SAFE docker images | tee "${LOG_DIR}/docker.images.txt"

      - name: Stop & remove previous container (if any)
        shell: bash
        run: |
          SECTION "Cleanup Previous Container"
          cname="ci-echo-app"
          if docker ps -a --format '{{.Names}}' | grep -q "^${cname}$"; then
            WARN "Container ${cname} exists; removing."
            docker logs "${cname}" > "${LOG_DIR}/container.prev.log" 2>&1 || true
            SAFE docker rm -f "${cname}"
          else
            OK "No existing container ${cname}"
          fi

      - name: Run container (detached)
        shell: bash
        run: |
          SECTION "Run Container"
          cname="ci-echo-app"
          image="${{ steps.meta.outputs.local_tag }}"
          SAFE docker run -d --name "${cname}" -p "${HEALTH_PORT}:${HEALTH_PORT}" "${image}" \
            | tee "${LOG_DIR}/container.run.id.txt"
          sleep 2
          SAFE docker ps --filter "name=${cname}" --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}" \
            | tee "${LOG_DIR}/container.ps.txt"

      - name: Healthcheck (inside curl → host fallback)
        shell: bash
        run: |
          SECTION "Healthcheck"
          cname="ci-echo-app"
          if docker exec "${cname}" sh -lc 'command -v curl' >/dev/null 2>&1; then
            SAFE docker exec "${cname}" sh -lc "curl -fsS http://127.0.0.1:${HEALTH_PORT}${HEALTH_PATH}" \
              | tee "${LOG_DIR}/health.container.curl.txt"
          else
            WARN "curl not in container; trying host mapped port"
            SAFE bash -lc "curl -fsS http://127.0.0.1:${HEALTH_PORT}${HEALTH_PATH}" \
              | tee "${LOG_DIR}/health.host.curl.txt"
          fi
          echo "OK" > "${ARTIFACT_DIR}/health.ok"

      - name: Logs snapshot
        if: always()
        shell: bash
        run: |
          SECTION "Log Snapshot"
          docker logs --since=0s ci-echo-app > "${LOG_DIR}/container.log" 2>&1 || true

      # - name: Cleanup container (optional)
      #   if: always()
      #   shell: bash
      #   run: |
      #     SECTION "Cleanup Container"
      #     SAFE docker rm -f ci-echo-app || true

      - name: CI Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Docker Image CI Summary"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Repo: \`${{ github.repository }}\`"
            echo "- Local Tag: \`${{ steps.meta.outputs.local_tag }}\`"
            echo "- GHCR Tags: \`${{ steps.meta.outputs.sha_tag }}\`, \`${{ steps.meta.outputs.time_tag }}\`"
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "- Pushed :latest: \`${{ steps.meta.outputs.latest_tag }}\`"
            else
              echo "- Pushed :latest: *(skipped)*"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-ci-logs
          path: |
            .github/echo_logs/**
            .github/echo_artifacts/**
          if-no-files-found: warn
