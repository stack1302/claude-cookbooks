name: "Docker Image CI + Run + Healthcheck + (Push on main)"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write     # GHCR 푸시에 필요
  id-token: write

concurrency:
  group: docker-image-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  LOG_DIR: .github/echo_logs
  ARTIFACT_DIR: .github/echo_artifacts
  DOCKER_BUILDKIT: "1"
  HEALTH_PORT: "8080"
  HEALTH_PATH: "/"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Echo helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${LOG_DIR}" "${ARTIFACT_DIR}"
          # 간단/안전 에코 유틸
          TS(){ date "+%Y-%m-%d %H:%M:%S%z"; }
          OK(){ echo "✅ $(TS) $*"; }
          WARN(){ echo "⚠️  $(TS) $*" >&2; }
          FAIL(){ echo "❌ $(TS) $*" >&2; }
          SAFE(){ if "$@"; then OK "OK: $*"; else FAIL "FAIL: $*"; return 1; fi; }
          export -f TS OK WARN FAIL SAFE
          OK "Helpers ready."

      - name: Docker sanity
        shell: bash
        run: |
          set -Eeuo pipefail
          SAFE docker --version | tee "${LOG_DIR}/docker.version.txt"
          SAFE docker info | tee "${LOG_DIR}/docker.info.txt"

      - name: Setup Buildx (cache enabled)
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -Eeuo pipefail
          ts="$(date +%Y%m%d%H%M%S)"
          sha_short="${GITHUB_SHA::7}"
          echo "local_tag=my-image-name:${ts}" | tee "${LOG_DIR}/image.local.txt"
          repo="ghcr.io/${GITHUB_REPOSITORY}"
          {
            echo "repo=${repo}"
            echo "sha_tag=${repo}:${sha_short}"
            echo "time_tag=${repo}:${ts}"
            echo "latest_tag=${repo}:latest"
          } | tee "${LOG_DIR}/image.ghcr.txt"
          {
            echo "local_tag=my-image-name:${ts}"
            echo "repo=${repo}"
            echo "sha_tag=${repo}:${sha_short}"
            echo "time_tag=${repo}:${ts}"
            echo "latest_tag=${repo}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Generate minimal Dockerfile if missing (no heredoc)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f Dockerfile ]]; then
            WARN(){ echo "⚠️  $(date "+%Y-%m-%d %H:%M:%S%z") $*" >&2; }; OK(){ echo "✅ $(date "+%Y-%m-%d %H:%M:%S%z") $*"; }
            WARN "Dockerfile not found. Generating a minimal one via printf (heredoc-free)."
            : > Dockerfile
            printf '%s\n' "FROM ubuntu:24.04" >> Dockerfile
            printf '%s\n' "ENV DEBIAN_FRONTEND=noninteractive" >> Dockerfile
            printf '%s\n' "RUN apt-get update -y && apt-get install -y --no-install-recommends \\" >> Dockerfile
            printf '%s\n' "      ca-certificates curl tini python3 && \\" >> Dockerfile
            printf '%s\n' "    rm -rf /var/lib/apt/lists/*" >> Dockerfile
            printf '%s\n' "WORKDIR /app" >> Dockerfile
            printf '%s\n' "COPY . /app" >> Dockerfile
            printf '%s\n' "EXPOSE 8080" >> Dockerfile
            printf '%s\n' 'ENTRYPOINT ["/usr/bin/tini","--"]' >> Dockerfile
            printf '%s\n' 'CMD ["bash","-lc","python3 -m http.server 8080"]' >> Dockerfile
            OK "Generated minimal Dockerfile."
          else
            echo "✅ $(date "+%Y-%m-%d %H:%M:%S%z") Using existing Dockerfile."
          fi

      # PR에서는 load, main push에서는 push
      - name: Build (PR:load / Push:push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.local_tag }}
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.time_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to GHCR (only on push)
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push :latest (main push)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "${{ steps.meta.outputs.time_tag }}" || true
          docker tag  "${{ steps.meta.outputs.time_tag }}" "${{ steps.meta.outputs.latest_tag }}"
          docker push "${{ steps.meta.outputs.latest_tag }}" | tee "${LOG_DIR}/docker.push.latest.txt"

      - name: Show images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker images | tee "${LOG_DIR}/docker.images.txt"

      - name: Stop & remove previous container (if any)
        shell: bash
        run: |
          set -Eeuo pipefail
          cname="ci-echo-app"
          if docker ps -a --format '{{.Names}}' | grep -q "^${cname}$"; then
            docker logs "${cname}" > "${LOG_DIR}/container.prev.log" 2>&1 || true
            docker rm -f "${cname}"
          fi

      - name: Run container (detached)
        shell: bash
        run: |
          set -Eeuo pipefail
          cname="ci-echo-app"
          image="${{ steps.meta.outputs.local_tag }}"
          docker run -d --name "${cname}" -p "${HEALTH_PORT}:${HEALTH_PORT}" "${image}" \
            | tee "${LOG_DIR}/container.run.id.txt"
          sleep 2
          docker ps --filter "name=${cname}" --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}" \
            | tee "${LOG_DIR}/container.ps.txt"

      - name: Healthcheck
        shell: bash
        run: |
          set -Eeuo pipefail
          cname="ci-echo-app"
          # 컨테이너 내부 curl → 없으면 호스트 포트로 시도
          if docker exec "${cname}" sh -lc 'command -v curl' >/dev/null 2>&1; then
            docker exec "${cname}" sh -lc "curl -fsS http://127.0.0.1:${HEALTH_PORT}${HEALTH_PATH}" \
              | tee "${LOG_DIR}/health.container.curl.txt"
          else
            curl -fsS "http://127.0.0.1:${HEALTH_PORT}${HEALTH_PATH}" \
              | tee "${LOG_DIR}/health.host.curl.txt"
          fi
          echo "OK" > "${ARTIFACT_DIR}/health.ok"

      - name: Logs snapshot
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker logs --since=0s ci-echo-app > "${LOG_DIR}/container.log" 2>&1 || true

      # 필요시 정리 원하면 주석 해제
      # - name: Cleanup container
      #   if: always()
      #   shell: bash
      #   run: |
      #     set -Eeuo pipefail
      #     docker rm -f ci-echo-app || true

      - name: Upload artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-ci-logs
          path: |
            .github/echo_logs/**
            .github/echo_artifacts/**
          if-no-files-found: warn
